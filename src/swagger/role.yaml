openapi: 3.0.0
info:
  title: Roles API
  version: 1.0.0
  description: Role management operations

tags:
  - name: Roles
    description: Role-related operations

paths:
  /api/roles:
    get:
      tags:
        - Roles
      summary: Get all roles
      responses:
        200:
          description: Returns list of all roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'

    post:
      tags:
        - Roles
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleName
              properties:
                roleName:
                  type: string
                roleDescription:
                  type: string
      responses:
        201:
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  newRole:
                    $ref: '#/components/schemas/Role'

  /api/roles/{id}:
    get:
      tags:
        - Roles
      summary: Get a specific role by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Returns role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
        404:
          description: Role not found

components:
  schemas:
    Role:
      type: object
      properties:
        id:
          type: integer
        role_name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
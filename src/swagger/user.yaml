openapi: 3.0.0
info:
  title: User API
  version: 1.0.0
  description: User management and authentication API

tags:
  - name: Users
    description: User-related operations

paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        200:
          description: Returns list of all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /api/users/signup:
    post:
      tags:
        - Users
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - phoneNumber
                - userEmail
                - createPassword
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                userEmail:
                  type: string
                  format: email
                createPassword:
                  type: string
                  format: password
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
                  token:
                    type: string
        400:
          description: Bad request

  /api/users/signin:
    post:
      tags:
        - Users
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userEmail
                - userPassword
              properties:
                userEmail:
                  type: string
                  format: email
                userPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserLoginResponse'
                  token:
                    type: string
        400:
          description: Invalid credentials

  /api/users/signout:
    post:
      tags:
        - Users
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  logoutTime:
                    type: string
                    format: date-time

  /api/users/forgot-password:
    post:
      tags:
        - Users
      summary: Send verification PIN to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userEmail
              properties:
                userEmail:
                  type: string
                  format: email
      responses:
        200:
          description: PIN sent to user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: User not found

  /api/users/reset-password:
    post:
      tags:
        - Users
      summary: Verify PIN & reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationCode
                - newPassword
              properties:
                verificationCode:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        400:
          description: Invalid or expired PIN

  /api/users/change-role:
    put:
      tags:
        - Users
      summary: Change user role (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - newRoleId
              properties:
                userId:
                  type: integer
                newRoleId:
                  type: integer
      responses:
        200:
          description: User role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /api/users/change-status:
    put:
      tags:
        - Users
      summary: Change user account status (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - newAccountStatusId
              properties:
                userId:
                  type: integer
                newAccountStatusId:
                  type: integer
      responses:
        200:
          description: User status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        user_email:
          type: string
          format: email
        role_id:
          type: integer
        status_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        userEmail:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    UserLoginResponse:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        userEmail:
          type: string
          format: email
        role:
          type: integer
        status:
          type: integer
        approvedBy:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
        lastLogout:
          type: string
          format: date-time
          nullable: true